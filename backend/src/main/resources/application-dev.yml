# Desarrollo local: base H2 persistente en backend/data/ (ignorada por Git).
# NO se conecta a SQL Server ni modifica ninguna base institucional.
spring:
  datasource:
    url: jdbc:h2:file:./data/deeptrack;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # Mantiene las tablas y los registros entre reinicios.
      ddl-auto: update
    show-sql: false
  h2:
    console:
      enabled: false
      path: /h2-console

# Umbral de demostración; no indica conectividad física de la sonda.
deeptrack:
  alerta:
    # Valores ficticios para QA; no son límites de seguridad del acuífero.
    inferior-metros: "${DEEPTRACK_ALERTA_INFERIOR:-10}"
    margen-metros: ${DEEPTRACK_ALERTA_MARGEN:2}
  monitoreo:
    vigencia-horas: ${DEEPTRACK_VIGENCIA_HORAS:48}
